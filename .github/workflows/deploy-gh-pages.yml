name: Deploy Concat Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      # This workflow is the single source of truth for the web editor's
      # health: the Rust CI in ci.yml no longer runs for web-only changes
      # (see its `paths-ignore`), so the suite and the type check have to
      # gate the deploy here. A broken editor never reaches the site.
      - name: Test (vitest)
        run: |
          cd web
          npm test

      - name: Typecheck (tsc --noEmit)
        run: |
          cd web
          npm run typecheck

      - name: Build Project
        run: |
          cd web
          npm run build

      - name: Create .nojekyll
        run: touch web/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
